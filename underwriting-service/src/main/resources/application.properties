spring.application.name=loan-underwriting-service
spring.config.import=optional:file:.env[.properties]
spring.main.web-application-type=none

spring.datasource.url=${UNDERWRITING_DB_URL:jdbc:h2:file:./data/underwriting;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${UNDERWRITING_DB_USERNAME:sa}
spring.datasource.password=${UNDERWRITING_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

underwriting.kafka.enabled=${KAFKA_ENABLED:true}
underwriting.kafka.input-topic=${KAFKA_LOAN_APPLICATION_TOPIC:loan-application-events}
underwriting.kafka.output-topic=${KAFKA_LOAN_DECISION_TOPIC:loan-decision-events}
underwriting.kafka.consumer-group=${KAFKA_UNDERWRITING_CONSUMER_GROUP:loan-underwriting-service-v1}
underwriting.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
underwriting.kafka.replicas=${KAFKA_TOPIC_REPLICAS:1}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=loan-underwriting-service
spring.kafka.consumer.group-id=${KAFKA_UNDERWRITING_CONSUMER_GROUP:loan-underwriting-service-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.seshi.underwriting.messaging.event.LoanApplicationEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.seshi.underwriting.messaging.event
spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.spring.json.add.type.headers=false
