spring.datasource.url=jdbc:h2:mem:loan_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.locations=classpath:db/migration/h2

# Unit and web-context tests do not require an external Kafka broker. The dedicated
# producer integration test overrides this property and starts an embedded broker.
loan.kafka.enabled=false
