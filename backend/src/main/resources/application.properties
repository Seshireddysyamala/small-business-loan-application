spring.application.name=small-business-loan-backend
spring.config.import=optional:file:.env[.properties]
spring.docker.compose.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/small_business_loan_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:loanapp}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration/{vendor}
loan.validation.restricted-country-codes=${RESTRICTED_COUNTRY_CODES:CU,IR,KP}

# Kafka producer
loan.kafka.enabled=${KAFKA_ENABLED:true}
loan.kafka.topic=${KAFKA_LOAN_APPLICATION_TOPIC:loan-application-events}
loan.kafka.decision-topic=${KAFKA_LOAN_DECISION_TOPIC:loan-decision-events}
loan.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
loan.kafka.replicas=${KAFKA_TOPIC_REPLICAS:1}
loan.kafka.decision-consumer-enabled=${KAFKA_DECISION_CONSUMER_ENABLED:true}
loan.kafka.decision-consumer-group=${KAFKA_DECISION_CONSUMER_GROUP:loan-application-decision-updater-v1}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=loan-application-api
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=${KAFKA_DECISION_CONSUMER_GROUP:loan-application-decision-updater-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.seshi.loanapplication.messaging.event.LoanDecisionEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.seshi.loanapplication.messaging.event
spring.kafka.listener.ack-mode=record

# Validation exceptions can contain rejected request values. Our API handler returns safe field
# messages, so suppress Spring's resolved-exception log to avoid writing SSNs to application logs.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
